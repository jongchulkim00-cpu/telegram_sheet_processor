services:
  stock-api:
    build: .
    container_name: telegram-sheet-stock-api
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8010
      ALLOW_STALE_CACHE: "false"
    ports:
      - "8010:8010"
    volumes:
      - ${STOCK_DATA_DIR:-./data}:/app/data
      - ${STOCK_OUTPUT_DIR:-./outputs}:/app/outputs
    restart: unless-stopped
